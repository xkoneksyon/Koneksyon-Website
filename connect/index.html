    :root{--bg:#080b11;--text:#f7f8fb;--muted:#9ba4b4;--line:rgba(255,255,255,.13);--line-hi:rgba(255,255,255,.23);--blue:#4f8cff}
    *{box-sizing:border-box}

    .language{position:absolute;z-index:20;top:max(12px,env(safe-area-inset-top));right:12px}
    .lang-button{height:27px;padding:0 9px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(11,14,21,.48);color:#f6f7fa;display:flex;align-items:center;gap:5px;font-size:9px;font-weight:700;letter-spacing:.08em;backdrop-filter:blur(24px) saturate(135%);-webkit-backdrop-filter:blur(24px) saturate(135%);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 5px 18px rgba(0,0,0,.18)}

    .lang-menu{position:absolute;right:0;top:34px;min-width:132px;padding:5px;border:1px solid rgba(255,255,255,.11);border-radius:14px;background:rgba(15,19,27,.92);box-shadow:0 18px 50px rgba(0,0,0,.38);backdrop-filter:blur(28px) saturate(140%);-webkit-backdrop-filter:blur(28px) saturate(140%);display:none}.language.open .lang-menu{display:block}
    .lang-option{width:100%;height:31px;border:0;border-radius:9px;background:transparent;color:#cfd5df;text-align:left;padding:0 9px;font-size:10px;font-weight:600;cursor:pointer}.lang-option:hover,.lang-option.active{background:rgba(255,255,255,.08);color:#fff}

    .links{position:relative;z-index:2;display:grid;gap:10px;margin-top:27px}
    .link{position:relative;min-height:56px;padding:0 15px;border-radius:19px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.088),rgba(255,255,255,.052));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 28px rgba(0,0,0,.15);display:grid;grid-template-columns:30px 1fr 20px;align-items:center;gap:8px;backdrop-filter:blur(26px) saturate(145%);-webkit-backdrop-filter:blur(26px) saturate(145%);transition:transform .2s ease,border-color .2s ease,background .2s ease;overflow:hidden}.link:before{content:"";position:absolute;inset:0;background:linear-gradient(112deg,rgba(255,255,255,.035),transparent 34%,rgba(255,255,255,.018));pointer-events:none}.link:hover{transform:translateY(-1px);border-color:var(--line-hi);background:linear-gradient(180deg,rgba(255,255,255,.115),rgba(255,255,255,.07))}
    .link-icon{position:relative;z-index:1;width:30px;height:30px;display:grid;place-items:center;color:#f8f9fb}.link-icon svg{width:18px;height:18px}.link-title{position:relative;z-index:1;text-align:center;font-size:12.5px;font-weight:700;letter-spacing:-.008em}.link-arrow{position:relative;z-index:1;display:grid;place-items:center;color:#8d96a6}.link-arrow svg{width:14px;height:14px}

  <script>
    const COPY={
      en:{code:'EN',slogan:'Where Culture Meets Connection.',appStore:'Download on the App Store',googlePlay:'Download on Google Play',website:'Koneksyon Website',support:'Contact & Support',privacy:'Privacy',terms:'Terms',guidelines:'Community Guidelines'},
      fr:{code:'FR',slogan:'Là où la culture crée des connexions.',appStore:'Télécharger sur l’App Store',googlePlay:'Télécharger sur Google Play',website:'Site web de Koneksyon',support:'Contact et assistance',privacy:'Confidentialité',terms:'Conditions',guidelines:'Règles de la communauté'},
      es:{code:'ES',slogan:'Donde la cultura crea conexiones.',appStore:'Descargar en App Store',googlePlay:'Descargar en Google Play',website:'Sitio web de Koneksyon',support:'Contacto y soporte',privacy:'Privacidad',terms:'Términos',guidelines:'Normas de la comunidad'},
      ht:{code:'HT',slogan:'Kote kilti kreye koneksyon.',appStore:'Telechaje sou App Store',googlePlay:'Telechaje sou Google Play',website:'Sit wèb Koneksyon',support:'Kontak ak sipò',privacy:'Konfidansyalite',terms:'Kondisyon',guidelines:'Règ kominote a'}
    };
    const picker=document.getElementById('languagePicker');
    const button=document.getElementById('langButton');
    const code=document.getElementById('langCode');
    const options=[...document.querySelectorAll('.lang-option')];
    function setLanguage(lang){const dict=COPY[lang]||COPY.en;document.documentElement.lang=lang==='ht'?'ht':lang;code.textContent=dict.code;document.querySelectorAll('[data-i18n]').forEach(el=>{const key=el.dataset.i18n;if(dict[key])el.textContent=dict[key];});options.forEach(o=>o.classList.toggle('active',o.dataset.lang===lang));try{localStorage.setItem('koneksyon-connect-language',lang);}catch(e){}}
    button.addEventListener('click',()=>{const open=picker.classList.toggle('open');button.setAttribute('aria-expanded',String(open));});
    options.forEach(option=>option.addEventListener('click',()=>{setLanguage(option.dataset.lang);picker.classList.remove('open');button.setAttribute('aria-expanded','false');}));
    document.addEventListener('click',e=>{if(!picker.contains(e.target)){picker.classList.remove('open');button.setAttribute('aria-expanded','false');}});
    let saved='en';try{saved=localStorage.getItem('koneksyon-connect-language')||'en';}catch(e){}setLanguage(COPY[saved]?saved:'en');
  </script>
