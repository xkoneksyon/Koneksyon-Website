<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://rsarqljktqecndsfklyf.supabase.co; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests">
<title>Koneksyon Ambassador Applications</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/ambassador.css">
<script src="assets/ambassador-admin.js" defer></script>
</head>
<body>
<header class="topbar">
  <a href="index.html" class="brand" aria-label="Koneksyon home"><img src="assets/logo-black.png" alt="Koneksyon"></a>
  <button id="adminLogoutBtn" class="text-button" type="button" hidden>Sign out</button>
</header>

<main class="admin-shell">
  <section id="adminLoginView" class="auth-card">
    <p class="eyebrow">Koneksyon Staff</p>
    <h2>Ambassador applications</h2>
    <p class="muted">Use an active Koneksyon admin account to review requests.</p>
    <form id="adminLoginForm">
      <label>Email<input id="adminEmail" type="email" autocomplete="username" required></label>
      <label>Password<input id="adminPassword" type="password" autocomplete="current-password" minlength="8" required></label>
      <button class="primary" type="submit">Open review queue</button>
      <p id="adminLoginError" class="error" role="alert" hidden></p>
    </form>
  </section>

  <section id="adminDashboard" hidden>
    <div class="admin-head">
      <div><p class="eyebrow">Ambassador Program</p><h1>Applications</h1></div>
      <button id="refreshApplicationsBtn" class="secondary" type="button">Refresh</button>
    </div>
    <div id="adminNotice" class="notice" hidden></div>
    <div id="applications" class="applications"></div>
    <p id="adminError" class="error" role="alert" hidden></p>
  </section>
</main>
</body>
</html>
