name: Prepare verified site-wide presentation
on:
  push:
    branches: [design/sitewide-theme-20261004]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Apply the tested presentation transformation
        run: python3 scripts/apply-sitewide-theme.py .
      - name: Verify exact output hashes before saving to the isolated branch
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          expected = json.loads(pathlib.Path('scripts/verified-theme.json').read_text())
          for name, wanted in expected.items():
              actual = hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              if actual != wanted:
                  raise SystemExit('Output mismatch: ' + name)
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          if not set(changed).issubset(expected):
              raise SystemExit('Unexpected modified paths: ' + str(changed))
          print('Verified all 17 output files against the locally tested bytes.')
          subprocess.run(['git', 'add', '--', *sorted(expected)], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prepare verified site-wide theme; preserve policy content [skip ci]'
          git push origin HEAD:design/sitewide-theme-20261004
