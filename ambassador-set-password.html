<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://rsarqljktqecndsfklyf.supabase.co; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests">
<title>Koneksyon Ambassador Password</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/ambassador.css">
<script src="assets/ambassador-i18n.js" defer></script>
<script src="assets/ambassador-set-password.js" defer></script>
</head>
<body>
<header class="topbar">
  <a href="index.html" class="brand" aria-label="Koneksyon home"><img src="assets/logo-black.png" alt="Koneksyon"></a>
  <label class="language-control"><span data-i18n="language">Language</span>
    <select id="passwordLanguageSelect">
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="ht">Kreyòl</option>
      <option value="es">Español</option>
    </select>
  </label>
</header>
<main class="shell">
  <section class="auth-card">
    <p class="eyebrow" data-i18n="program">Koneksyon Ambassador Program</p>
    <h2 data-i18n="pwdTitle">Create your password</h2>
    <p class="muted" data-i18n="pwdIntro"></p>
    <form id="setPasswordForm">
      <label><span data-i18n="newPassword">New password</span><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label>
      <label><span data-i18n="confirmPassword">Confirm password</span><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label>
      <button class="primary" type="submit" data-i18n="savePassword">Save password</button>
      <p id="passwordStatus" class="success" role="status"></p>
      <p id="passwordError" class="error" role="alert" hidden></p>
    </form>
    <p class="muted small"><a id="backPortalLink" href="ambassador.html" data-i18n="backPortal">Back to Ambassador Portal</a></p>
  </section>
</main>
</body>
</html>
