<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://rsarqljktqecndsfklyf.supabase.co; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests">
<title>Set Ambassador Password — Koneksyon</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/ambassador.css">
<script src="assets/ambassador-set-password.js" defer></script>
</head>
<body>
<header class="topbar"><a href="index.html" class="brand" aria-label="Koneksyon home"><img src="assets/logo-black.png" alt="Koneksyon"></a></header>
<main class="shell">
  <section class="auth-card">
    <p class="eyebrow">Koneksyon Ambassador Program</p>
    <h2>Create your password</h2>
    <p class="muted">Use this password to sign in to the Ambassador Portal. Your password is handled by Koneksyon's secure authentication service and is never visible to ambassadors or staff.</p>
    <form id="setPasswordForm">
      <label>New password<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Confirm password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label>
      <button class="primary" type="submit">Save password</button>
      <p id="passwordStatus" class="success" role="status"></p>
      <p id="passwordError" class="error" role="alert" hidden></p>
    </form>
    <p class="muted small"><a href="ambassador.html">Back to Ambassador Portal</a></p>
  </section>
</main>
</body>
</html>
